# Stages the package on npm when a GitHub release is published. A maintainer
# then approves the staged version on npmjs.com (with 2FA) to make it live.
#
# Uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed and
# provenance attestations are generated automatically. The trusted publisher
# may only stage, so a compromised workflow can never publish on its own.
# See RELEASING.md.
#
# One-time setup on npmjs.com (package maintainer):
#   1. Open https://www.npmjs.com/package/aws-cloudfront-sign/access
#   2. Under "Trusted Publisher", choose "GitHub Actions" and enter:
#        Organization or user: jasonsims
#        Repository:           aws-cloudfront-sign
#        Workflow filename:    release.yml
#        Environment:          (leave empty)
#      and leave "Allow npm publish" and "Allow npm dist-tag" unchecked
#      (`npm stage publish` is always allowed).
#   3. Optionally, set "Publishing access" to require 2FA and disallow tokens,
#      so trusted publishing is the only way to publish.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency cache here on purpose: a release build should not
      # restore a cache that other workflows could have written.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports staged publishing (>= 11.15.0)
        run: |
          current="$(npm --version)"
          echo "npm $current"
          if ! node -e '
            const [maj, min] = process.argv[1].split(".").map(Number);
            process.exit(maj > 11 || (maj === 11 && min >= 15) ? 0 : 1);
          ' "$current"; then
            npm install -g "npm@^11.15.0"
            echo "upgraded to npm $(npm --version)"
          fi

      - name: Verify release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "${RELEASE_TAG#v}" != "$pkg_version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$pkg_version'"
            exit 1
          fi
          echo "Tag $RELEASE_TAG matches package.json version $pkg_version"

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package

      # Pack once, run the integration tests on that exact tarball, then stage
      # it. Staging a tarball skips lifecycle scripts, so prepublishOnly doesn't
      # rebuild and the staged artifact is the one that was checked.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"

      # Includes the CloudFront smoke tests; CF_SMOKE=required fails the release
      # if the secrets are missing rather than skipping them.
      - name: Integration tests on the tarball (incl. CloudFront smoke tests)
        env:
          CF_SMOKE: required
          CF_URL: ${{ secrets.CF_URL }}
          CF_KEYPAIR_ID: ${{ secrets.CF_KEYPAIR_ID }}
          CF_PRIVATE_KEY: ${{ secrets.CF_PRIVATE_KEY }}
        run: node scripts/integration-test.mjs "$RUNNER_TEMP"/pack/*.tgz

      - name: Stage for publishing
        run: npm stage publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public

      - name: Approval needed
        run: |
          echo "::notice::Staged. Approve it on npmjs.com (or run 'npm stage list aws-cloudfront-sign' and 'npm stage approve <stage-id>') to publish."
